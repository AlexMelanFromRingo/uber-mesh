name: ci

on:
  push:
    branches: [main, master, "001-*", "audit/*"]
  pull_request:

# Least privilege for every job's GITHUB_TOKEN (read-only checkout); jobs never write to the repo.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

# Third-party actions are pinned to full commit SHAs (tag in the trailing comment) so a moved or
# compromised tag cannot inject code into CI. Bump deliberately (e.g. via Dependabot/Renovate).
jobs:
  test:
    name: fmt, clippy, build & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master (2026-11)
        with:
          toolchain: stable
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: fmt
        run: cargo fmt --all --check
      - name: clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: build
        run: cargo build --workspace --locked
      - name: test
        run: cargo test --workspace --locked

  supply-chain:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check advisories bans licenses sources

  audit:
    name: cargo-audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@68a389c788b2cd04016ce8c80ee23b80d2ab3d68 # v2.88.1
        with:
          tool: cargo-audit
      # `--deny warnings` fails on unmaintained/unsound/yanked too, not just vulnerabilities.
      # Ignores mirror deny.toml [advisories].ignore (keep in sync): two unmaintained crates with no
      # known vulnerability, and hickory-proto, which is lockfile-only (never compiled) — the
      # guard step below proves that and fails the moment it stops being true.
      - name: cargo audit
        run: >
          cargo audit --deny warnings
          --ignore RUSTSEC-2025-0141
          --ignore RUSTSEC-2024-0436
          --ignore RUSTSEC-2026-0118
          --ignore RUSTSEC-2026-0119
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master (2026-11)
        with:
          toolchain: stable
      - name: deps-not-built (lockfile-only advisories really are absent from the build)
        run: |
          for c in hickory-proto libp2p-mdns libp2p-dns; do
            if cargo tree --workspace --all-features --target all -e normal,build -i "$c" 2>/dev/null | grep -q .; then
              echo "::error::$c is now in the build graph — remove its advisory ignores and fix it"
              exit 1
            fi
          done

  fuzz:
    name: fuzz smoke (every target)
    runs-on: ubuntu-latest
    env:
      # libFuzzer needs its own instrumentation; don't inherit the workspace -D warnings flags.
      RUSTFLAGS: ""
      FUZZ_SECONDS: "30"
      # install-action ships a musl-built cargo-fuzz, which would default to the musl target —
      # incompatible with the address sanitizer. Always fuzz on the glibc target.
      FUZZ_TARGET: x86_64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master (2026-11)
        with:
          toolchain: nightly
      - uses: taiki-e/install-action@68a389c788b2cd04016ce8c80ee23b80d2ab3d68 # v2.88.1
        with:
          tool: cargo-fuzz
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: fuzz
      - name: build all fuzz targets
        run: cargo +nightly fuzz build --target "$FUZZ_TARGET"
      - name: short run of every target in fuzz/fuzz_targets
        # Glob the directory (not a hard-coded list) so new harnesses are exercised automatically;
        # a .rs file that is not registered as a [[bin]] in fuzz/Cargo.toml fails the job.
        run: |
          set -euo pipefail
          shopt -s nullglob
          targets=(fuzz/fuzz_targets/*.rs)
          if [ ${#targets[@]} -eq 0 ]; then
            echo "no fuzz targets found" >&2; exit 1
          fi
          for f in "${targets[@]}"; do
            t="$(basename "$f" .rs)"
            echo "::group::fuzz $t (${FUZZ_SECONDS}s)"
            cargo +nightly fuzz run --target "$FUZZ_TARGET" "$t" -- -max_total_time="${FUZZ_SECONDS}" -rss_limit_mb=2048
            echo "::endgroup::"
          done
      - name: upload crash artifacts
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-artifacts
          path: fuzz/artifacts
          if-no-files-found: ignore
