# Scalable uber-mesh cluster on an isolated bridge network under tc-netem impairment, with a
# Prometheus that scrapes every node's /metrics via Docker DNS service discovery.
#
#   NODES=100 bash docker/run-cluster.sh        # 1 bootstrap + 99 scaled nodes + prometheus
#
# The `node` service is scaled with `docker compose up --scale node=N`. All replicas dial the
# bootstrap by its static IP; Prometheus resolves the `node` service name to every replica IP.
#
# Security posture (audit 2026-11):
# - The cohort PSK is NOT hardcoded: export UMESH_PSK (run-cluster.sh generates a random one). It
#   reaches the node via the environment, never argv.
# - Node /metrics is opt-in (UMESH_METRICS_ADDR) and bound inside the private bridge network only;
#   node ports are not published to the host.
# - Prometheus/Grafana are published on 127.0.0.1 only; Grafana has no anonymous access and its
#   admin password comes from GRAFANA_ADMIN_PASSWORD.
# - Node containers start as root ONLY to apply tc-netem (NET_ADMIN), then drop to uid 10001
#   (SETUID/SETGID are needed for that drop). All other capabilities are dropped.

x-env: &env
  UMESH_PSK: "${UMESH_PSK:?export UMESH_PSK=$(openssl rand -hex 32)}"
  UMESH_METRICS_ADDR: "0.0.0.0:9100" # private bridge network only; not published
  RUST_LOG: "warn"

x-netem-node: &netem-node
  image: uber-mesh:bench
  user: "0:0" # entrypoint applies tc-netem, then drops to uid 10001
  cap_drop: [ALL]
  cap_add: [NET_ADMIN, SETUID, SETGID]
  security_opt: ["no-new-privileges:true"]
  read_only: true
  tmpfs: ["/data:uid=10001,gid=10001,mode=0700"]

services:
  boot:
    <<: *netem-node
    environment:
      <<: *env
      NETEM: "${NETEM:-delay 50ms 10ms distribution normal loss 2%}"
    networks:
      mesh:
        ipv4_address: 172.30.0.10

  node:
    <<: *netem-node
    depends_on: [boot]
    environment:
      <<: *env
      NETEM: "${NETEM:-delay 50ms 10ms distribution normal loss 2%}"
      BOOTSTRAP: "/ip4/172.30.0.10/tcp/4001"
    networks: [mesh]

  prometheus:
    image: prom/prometheus:v3.15.1@sha256:fa3302279710be2f21a8301ec17a8b4f2301fd829bd113839b3b6b02b6f191a2
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=1h
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "127.0.0.1:9090:9090"
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    depends_on: [boot]
    networks: [mesh]

  grafana:
    image: grafana/grafana:13.2.5@sha256:9f7aa1e1e3246aade5792d35a738049f7f32f89cd51d1956cf426a4e86268a84
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: "${GRAFANA_ADMIN_PASSWORD:?export GRAFANA_ADMIN_PASSWORD=$(openssl rand -hex 16)}"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
    ports:
      - "127.0.0.1:3000:3000"
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    volumes:
      - ./grafana/datasource.yml:/etc/grafana/provisioning/datasources/ds.yml:ro
      - ./grafana/dashboards.yml:/etc/grafana/provisioning/dashboards/dash.yml:ro
      - ./grafana/uber-mesh.json:/var/lib/grafana/dashboards/uber-mesh.json:ro
    depends_on: [prometheus]
    networks: [mesh]

networks:
  mesh:
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.0.0/16
