[workspace]
resolver = "3"
members = [
    "crates/umesh-crypto",
    "crates/umesh-obfs",
    "crates/umesh-p2p",
    "crates/umesh-node",
    "crates/uber-mesh",
]
# The fuzz crate needs nightly + libfuzzer; excluded from normal `cargo build --workspace`.
exclude = ["fuzz"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MPL-2.0"
authors = ["uber-mesh contributors"]
repository = "https://github.com/AlexMelanFromRingo/uber-mesh"
rust-version = "1.88"

# Default-deny unsafe across the workspace (constitution Principle IV).
# The crypto crate additionally `#![forbid(unsafe_code)]`.
[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[workspace.dependencies]
# --- crypto (pure-Rust core) ---
blake3 = "1.8"
ed25519-dalek = { version = "2.2", features = ["rand_core", "zeroize"] }
x25519-dalek = { version = "2", features = ["zeroize", "static_secrets"] }
ml-kem = { version = "0.3", features = ["getrandom"] }
chacha20poly1305 = { version = "0.11", features = ["alloc"] }
rand = "0.8"
# NB: bincode 3.0.0 is a protest/troll release that refuses to compile (compile_error!); 2.x is the
# real, maintained line with the same Encode/Decode derive + encode_to_vec/decode_from_slice API.
bincode = "2"
zeroize = { version = "1", features = ["zeroize_derive"] }
subtle = "2"
hex = "0.4"

# --- shared infra ---
thiserror = "2"
async-trait = "0.1"
tracing = "0.1"
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "net", "io-util", "time", "macros", "sync", "signal"] }
tokio-util = { version = "0.7", features = ["compat"] }
futures = "0.3"
serde_json = "1"
toml = "0.8"
clap = { version = "4", features = ["derive"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"

# --- dev / test ---
proptest = "1"

# internal crates (version pins the path dep so it is not a wildcard — cargo-deny `bans.wildcards`)
umesh-crypto = { path = "crates/umesh-crypto", version = "0.1.0" }
umesh-obfs = { path = "crates/umesh-obfs", version = "0.1.0" }
umesh-p2p = { path = "crates/umesh-p2p", version = "0.1.0" }
umesh-node = { path = "crates/umesh-node", version = "0.1.0" }

[profile.release]
lto = "thin"
codegen-units = 1
