[package]
name = "umesh-crypto"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true
description = "Pure-Rust crypto core for uber-mesh: hybrid X25519+ML-KEM-768, Ed25519, BLAKE3, XChaCha20-Poly1305, Merkle, PoW"

[dependencies]
blake3.workspace = true
ed25519-dalek.workspace = true
x25519-dalek.workspace = true
# `zeroize`: wipe ML-KEM decapsulation keys and the cached XChaCha20-Poly1305 key on drop
# (constitution Principle I). Features are additive on top of the workspace pins.
ml-kem = { workspace = true, features = ["zeroize"] }
chacha20poly1305 = { workspace = true, features = ["zeroize"] }
rand.workspace = true
zeroize.workspace = true
subtle.workspace = true
thiserror.workspace = true

[dev-dependencies]
hex.workspace = true
proptest.workspace = true
x25519-dalek.workspace = true

[lints]
workspace = true
