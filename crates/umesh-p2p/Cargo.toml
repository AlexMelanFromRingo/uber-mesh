[package]
name = "umesh-p2p"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true
description = "libp2p mesh behaviour for uber-mesh (signed gossip, discovery, NAT)"

[dependencies]
umesh-crypto.workspace = true
umesh-obfs.workspace = true
rand.workspace = true
# Sealed topics/blobs (end-to-end confidentiality): wipe topic/content keys on drop, constant-time
# key comparison. Both are already in the tree via umesh-crypto.
zeroize.workspace = true
subtle.workspace = true
thiserror.workspace = true
async-trait.workspace = true
tracing.workspace = true
bincode.workspace = true
tokio.workspace = true
tokio-util.workspace = true
futures.workspace = true
# NOT libp2p's umbrella "tokio" feature: it names `libp2p-{mdns,dns,quic,upnp}?/tokio`, and weak
# dependency features put those crates (hickory-proto, quinn, rcgen/time…) into Cargo.lock even
# though we never build them. Enable tokio directly on the two sub-crates we use instead.
libp2p-swarm = { version = "0.47", features = ["tokio"] }
libp2p-tcp = { version = "0.44", features = ["tokio"] }
libp2p = { version = "0.56", features = [
    "gossipsub",
    "identify",
    "ping",
    "kad",
    "noise",
    "yamux",
    "tcp",
    "macros",
    "autonat",
    "relay",
    "dcutr",
    "request-response",
] }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util", "macros", "rt-multi-thread"] }

[lints]
workspace = true
