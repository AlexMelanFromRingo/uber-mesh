# cargo-deny supply-chain policy (constitution Principle VII).
# Run: cargo deny check

[advisories]
version = 2
# Fail the build on any security advisory or unmaintained/yanked crate.
yanked = "deny"
# Documented, reviewed exceptions only (constitution Principle VII — we acknowledge these, not hide them).
# Every entry is mirrored as an `--ignore` flag on the cargo-audit job in
# .github/workflows/ci.yml — keep both lists in sync. Never add a real vulnerability here: update the
# dependency. Re-check every entry after `cargo update` and delete it once it no longer matches.
ignore = [
    # bincode is flagged "unmaintained". We deliberately depend on the 2.x line: bincode 3.0.0 is a
    # protest/troll release that refuses to compile, and 2.x is the real, maintained-as-of-pin API.
    # No known vulnerability; revisit if a maintained successor appears. (docs/security-and-deferred.md)
    "RUSTSEC-2025-0141",
    # `paste` (proc-macro) is unmaintained but is a transitive dep pulled by the crypto stack, has no
    # known vulnerability, and runs only at compile time. No drop-in replacement is pulled by our deps.
    "RUSTSEC-2024-0436",
    # hickory-proto 0.25.2 (DNSSEC NSEC3 loop; O(n²) name compression) is NOT compiled into any
    # uber-mesh binary: it sits in Cargo.lock only because libp2p's `tokio` feature names
    # `libp2p-mdns?/tokio` / `libp2p-dns?/tokio` (weak deps lock optional crates even when off —
    # rust-lang/cargo#10801). We enable neither mdns nor dns. CI's `deps-not-built` guard fails if
    # hickory-proto ever enters the real build graph, at which point these ignores must go.
    "RUSTSEC-2026-0118",
    "RUSTSEC-2026-0119",
]

[licenses]
version = 2
# Permissive + weak-copyleft licenses acceptable for a security tool we ship as MPL-2.0.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "MPL-2.0",
    "Zlib",
    "CC0-1.0",
]
confidence-threshold = 0.9

[bans]
# Surface accidental dependency bloat / duplicate major versions for review.
multiple-versions = "warn"
wildcards = "deny"
# Never link a second TLS/crypto stack by accident in the default (pure-Rust) build.
deny = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
